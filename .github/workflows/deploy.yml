name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull, build front and restart api
        run: |
          set -e
          cd /opt/tienda-ia/TIENDAIA-HIERBAS
          git pull origin main

          # Frontend: nginx sirve frontend/dist por bind mount, alcanza con rebuildear.
          cd frontend
          npm ci --include=dev
          npm run build

          # Backend: el contenedor monta el checkout, reiniciar reinstala deps y migra.
          cd /opt/tienda-ia/TIENDA-IA-DEPLOY
          docker compose restart hierbas-api
