<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- interactive-widget=resizes-content: al abrir el teclado en Android, el layout
         se achica en vez de que el teclado tape el contenido (útil en los modales). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />

    <!-- Fuentes: se cargan con <link> en el <head> (no con @import encadenado en el
         CSS) para que el navegador las descubra apenas parsea el HTML. En iOS con red
         lenta, el @import en cadena hacía que la fuente de íconos (Material Symbols)
         no llegara y los botones mostraran el texto de la ligadura ("arrow_back").
         Los íconos van con display=block: mejor un instante en blanco que ver la
         palabra suelta (que además Safari traducía). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Manrope:wght@400;600;700&family=Work+Sans:wght@400;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
    />

    <title>Hierbas Serranas La Paz</title>
    <style>
      .pantalla-error-general { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; font-family: system-ui, sans-serif; color: #1a361b; background: #eaf0e6; }
      .pantalla-error-general p { margin: 0; max-width: 320px; line-height: 1.5; }
      .pantalla-error-general button { padding: 12px 28px; border: none; border-radius: 999px; background: #1a361b; color: #fff; font-size: 1rem; font-weight: 600; }
      .carga-lenta { opacity: 0; animation: cargaLentaAparece 0.3s ease-out 8s forwards; }
      @keyframes cargaLentaAparece { to { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="pantalla-error-general carga-lenta">
        <p>La página está tardando en cargar. Revisá la conexión y tocá Recargar. Si sigue sin cargar, abrí el link desde Chrome o Safari.</p>
        <button type="button" onclick="location.reload()">Recargar</button>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
